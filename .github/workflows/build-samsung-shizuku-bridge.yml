name: Samsung One UI Shizuku Bridge

on:
  workflow_dispatch:
  push:
    branches: [fix/samsung-oneui-shizuku-palette-bridge]
  pull_request:

permissions:
  contents: read

concurrency:
  group: samsung-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java toolchains (Gradle runs on 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Test independent JVM bridge core
        run: ./gradlew -p bridge-tests test --no-daemon --max-workers=2
      - name: Test real palette generator and Android integration
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --max-workers=2
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorBlendr-Samsung-OneUI-Shizuku-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-Bridge-Test-Results
          path: |
            bridge-tests/build/test-results/
            bridge-tests/build/reports/tests/
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
